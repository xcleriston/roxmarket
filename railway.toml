[build]
builder = "NIXPACKS"
buildCommand = "npm install --ignore-scripts && npm run build"

[deploy]
startCommand = "node dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"
PORT = "3000"

# Force redeploy
RAILWAY_DEPLOY_TRIGGER = "force-redeploy-$(date +%s)"
